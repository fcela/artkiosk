<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="app.webmanifest">
  <title>Art Kiosk</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: none;
    }
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <iframe id="stage" title="sketch"></iframe>
  <div id="start-overlay">Tap to start full screen</div>
  <script>
    // A page can only enter the Fullscreen API in response to a real user
    // gesture, so the kiosk starts with a tap target that both requests
    // fullscreen and dismisses itself. Later iframe src swaps don't navigate
    // the top-level document, so fullscreen persists across rotation.
    const overlay = document.getElementById('start-overlay');
    overlay.addEventListener('click', () => {
      const el = document.documentElement;
      const request = el.requestFullscreen
        || el.webkitRequestFullscreen
        || el.msRequestFullscreen;
      if (request) request.call(el).catch(() => {});
      overlay.remove();
      requestWakeLock();
    }, { once: true });
  </script>
  <script>
    // A canvas animation alone doesn't stop a device from locking its
    // screen the way a playing <video> does (that's why YouTube fullscreen
    // never locks but our p5 sketches did). Two independent defenses:

    // 1. The standards-based Screen Wake Lock API. Re-request on every
    // visibility change, since the lock is released whenever the tab/screen
    // is hidden and isn't automatically restored.
    let wakeLock = null;
    function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(lock => {
        wakeLock = lock;
      }).catch(() => {});
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();

    // 2. Fallback for browsers without Wake Lock support: a genuinely
    // playing (muted, looping) <video>, matching the "video is playing"
    // state that platform idle timers exempt. Built from a live canvas
    // stream instead of a bundled video file, so nothing needs to be shipped.
    const keepAwakeCanvas = document.createElement('canvas');
    keepAwakeCanvas.width = 2;
    keepAwakeCanvas.height = 2;
    const kaCtx = keepAwakeCanvas.getContext('2d');
    (function paint() {
      kaCtx.fillRect(0, 0, 2, 2);
      requestAnimationFrame(paint);
    })();

    if (keepAwakeCanvas.captureStream) {
      const keepAwakeVideo = document.createElement('video');
      keepAwakeVideo.srcObject = keepAwakeCanvas.captureStream(1);
      keepAwakeVideo.muted = true;
      keepAwakeVideo.setAttribute('playsinline', '');
      keepAwakeVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
      document.body.appendChild(keepAwakeVideo);
      keepAwakeVideo.play().catch(() => {});
    }
  </script>
  <script>
    // How long each sketch stays on screen before rotating, in milliseconds.
    const ROTATE_MS = 3 * 60 * 1000;
    // How often to re-fetch the sketch list, so newly added/removed sketches
    // show up on a kiosk tab that's been running for days without ever
    // reloading the page (a reload would exit fullscreen).
    const REFRESH_MANIFEST_MS = 30 * 60 * 1000;

    const stage = document.getElementById('stage');
    let sketches = [];
    let current = 0;

    function showCurrent() {
      if (sketches.length === 0) return;
      // Cache-bust so a long-running kiosk tab picks up edits to the sketch file.
      stage.src = sketches[current].path + '?t=' + Date.now();
    }

    function advance() {
      current = (current + 1) % sketches.length;
      showCurrent();
    }

    // An entry with "enabled": false stays in the manifest and stays visible in
    // the gallery, but drops out of the kiosk rotation. Anything without the
    // key counts as enabled.
    function fetchManifest() {
      return fetch('sketches/manifest.json?t=' + Date.now())
        .then(res => res.json())
        .then(list => list.filter(s => s.enabled !== false));
    }

    function refreshManifest() {
      fetchManifest().then(list => {
        if (list.length === 0) return;
        const currentId = sketches[current] && sketches[current].id;
        sketches = list;
        // Keep showing the same sketch if it still exists, rather than
        // jumping to a different one just because the list changed.
        const idx = sketches.findIndex(s => s.id === currentId);
        current = idx !== -1 ? idx : current % sketches.length;
      }).catch(() => {});
    }

    fetchManifest().then(list => {
      sketches = list;
      // Start on a random sketch so a fleet of devices doesn't stay in lockstep.
      current = Math.floor(Math.random() * sketches.length);
      showCurrent();
      setInterval(advance, ROTATE_MS);
      setInterval(refreshManifest, REFRESH_MANIFEST_MS);
    });
  </script>
</body>
</html>
