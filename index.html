<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="app.webmanifest">
  <title>Art Kiosk</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: none;
    }
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: safe center;
      justify-content: center;
      overflow-y: auto;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 10;
    }
    .minimal-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 1.5rem;
    }
    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: #666;
      margin-bottom: 1.4rem;
      text-transform: uppercase;
    }
    #sketch-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 2rem;
    }
    .sketch-option {
      position: relative;
    }
    .sketch-checkbox {
      display: none;
    }
    .sketch-label {
      font-size: 2.1rem;
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #333;
      cursor: pointer;
      transition: color 0.4s ease, transform 0.4s ease;
      display: block;
      user-select: none;
    }
    .sketch-checkbox:checked + .sketch-label {
      color: #fff;
    }
    .sketch-label:hover {
      color: #777;
    }
    .sketch-checkbox:checked + .sketch-label:hover {
      color: #fff;
      transform: translateX(15px);
    }
    #start-btn {
      background: transparent;
      color: #fff;
      border: 1px solid #333;
      padding: 0.85rem 2.2rem;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
      align-self: flex-start;
      border-radius: 100px;
    }
    #start-btn:hover:not(:disabled) {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    #start-btn:disabled {
      color: #222;
      border-color: #111;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <iframe id="stage" title="sketch"></iframe>
  <div id="start-overlay">
    <div class="minimal-container">
      <div class="subtitle">Select Art for Rotation</div>
      <div id="sketch-list"></div>
      <button id="start-btn" disabled>Launch Kiosk</button>
    </div>
  </div>
  <script>
    // A page can only enter the Fullscreen API in response to a real user
    // gesture. We'll call this when the user clicks the "Start Kiosk" button.
    function enterFullscreenAndStart() {
      startKiosk();
      const el = document.documentElement;
      const request = el.requestFullscreen
        || el.webkitRequestFullscreen
        || el.msRequestFullscreen;
      if (request) request.call(el).catch(() => {});
      document.getElementById('start-overlay').remove();
      requestWakeLock();
    }
  </script>
  <script>
    // A canvas animation alone doesn't stop a device from locking its
    // screen the way a playing <video> does (that's why YouTube fullscreen
    // never locks but our p5 sketches did). Two independent defenses:

    // 1. The standards-based Screen Wake Lock API. Re-request on every
    // visibility change, since the lock is released whenever the tab/screen
    // is hidden and isn't automatically restored.
    let wakeLock = null;
    function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(lock => {
        wakeLock = lock;
      }).catch(() => {});
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();

    // 2. Fallback for browsers without Wake Lock support: a genuinely
    // playing (muted, looping) <video>, matching the "video is playing"
    // state that platform idle timers exempt. Built from a live canvas
    // stream instead of a bundled video file, so nothing needs to be shipped.
    const keepAwakeCanvas = document.createElement('canvas');
    keepAwakeCanvas.width = 2;
    keepAwakeCanvas.height = 2;
    const kaCtx = keepAwakeCanvas.getContext('2d');
    (function paint() {
      kaCtx.fillRect(0, 0, 2, 2);
      requestAnimationFrame(paint);
    })();

    if (keepAwakeCanvas.captureStream) {
      const keepAwakeVideo = document.createElement('video');
      keepAwakeVideo.srcObject = keepAwakeCanvas.captureStream(1);
      keepAwakeVideo.muted = true;
      keepAwakeVideo.setAttribute('playsinline', '');
      keepAwakeVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
      document.body.appendChild(keepAwakeVideo);
      keepAwakeVideo.play().catch(() => {});
    }
  </script>
  <script>
    // How long each sketch stays on screen before rotating, in milliseconds.
    const ROTATE_MS = 3 * 60 * 1000;
    // How often to re-fetch the sketch list, so newly added/removed sketches
    // show up on a kiosk tab that's been running for days without ever
    // reloading the page (a reload would exit fullscreen).
    const REFRESH_MANIFEST_MS = 30 * 60 * 1000;

    const stage = document.getElementById('stage');
    let sketches = [];
    let selectedIds = new Set();
    let current = 0;

    function showCurrent() {
      if (sketches.length === 0) return;
      // Cache-bust so a long-running kiosk tab picks up edits to the sketch file.
      stage.src = sketches[current].path + '?t=' + Date.now();
    }

    function advance() {
      if (sketches.length === 0) return;
      current = (current + 1) % sketches.length;
      showCurrent();
    }

    // An entry with "enabled": false stays in the manifest and stays visible in
    // the gallery, but drops out of the kiosk rotation. Anything without the
    // key counts as enabled.
    function fetchManifest() {
      return fetch('sketches/manifest.json?t=' + Date.now())
        .then(res => res.json())
        .then(list => list.filter(s => s.enabled !== false));
    }

    function refreshManifest() {
      fetchManifest().then(list => {
        // Filter the newly fetched list by the user's initial selections
        const filteredList = list.filter(s => selectedIds.has(s.id));
        if (filteredList.length === 0) return;
        
        const currentId = sketches[current] && sketches[current].id;
        sketches = filteredList;
        // Keep showing the same sketch if it still exists, rather than
        // jumping to a different one just because the list changed.
        const idx = sketches.findIndex(s => s.id === currentId);
        current = idx !== -1 ? idx : current % sketches.length;
      }).catch(() => {});
    }

    function startKiosk() {
      // Get selected IDs from checkboxes
      const checkboxes = document.querySelectorAll('.sketch-checkbox:checked');
      checkboxes.forEach(cb => selectedIds.add(cb.value));
      
      // Filter the initial sketches list by selections
      sketches = sketches.filter(s => selectedIds.has(s.id));
      
      if (sketches.length === 0) return;
      
      // Start on a random sketch so a fleet of devices doesn't stay in lockstep.
      current = Math.floor(Math.random() * sketches.length);
      showCurrent();
      setInterval(advance, ROTATE_MS);
      setInterval(refreshManifest, REFRESH_MANIFEST_MS);
    }

    function updateStartButtonState() {
      const anyChecked = document.querySelectorAll('.sketch-checkbox:checked').length > 0;
      document.getElementById('start-btn').disabled = !anyChecked;
    }

    // Initialize the setup panel
    fetchManifest().then(list => {
      sketches = list; // Keep full list temporarily for rendering options
      
      const listContainer = document.getElementById('sketch-list');
      const startBtn = document.getElementById('start-btn');
      
      list.forEach(sketch => {
        const option = document.createElement('div');
        option.className = 'sketch-option';
        
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = 'sketch-' + sketch.id;
        cb.value = sketch.id;
        cb.className = 'sketch-checkbox';
        cb.checked = true; // Default all to checked
        cb.addEventListener('change', updateStartButtonState);
        
        const label = document.createElement('label');
        label.htmlFor = cb.id;
        label.className = 'sketch-label';
        label.textContent = sketch.title;
        
        option.appendChild(cb);
        option.appendChild(label);
        listContainer.appendChild(option);
      });
      
      updateStartButtonState();
      
      startBtn.addEventListener('click', () => {
        enterFullscreenAndStart();
      });
    });
  </script>
</body>
</html>
