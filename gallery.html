<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Kiosk — Gallery</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #0a0a0a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    p.sub {
      color: #888;
      margin-top: 0;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: #151515;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      border: 1px solid #262626;
      transition: border-color 0.15s ease;
    }
    .card:hover {
      border-color: #555;
    }
    .card iframe {
      width: 100%;
      height: 200px;
      border: none;
      pointer-events: none;
      display: block;
    }
    .card .label {
      padding: 0.75rem 1rem;
    }
    .card .label h2 {
      font-size: 1rem;
      margin: 0 0 0.25rem 0;
      font-weight: 500;
    }
    .card .label p {
      font-size: 0.85rem;
      color: #999;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Art Kiosk</h1>
  <p class="sub">Browse individual sketches. The <a href="index.html" style="color:#9cf;">kiosk view</a> auto-rotates through all of them full-screen.</p>
  <div class="grid" id="grid"></div>
  <script>
    fetch('sketches/manifest.json')
      .then(res => res.json())
      .then(list => {
        const grid = document.getElementById('grid');
        list.forEach(sketch => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = sketch.path;
          card.innerHTML = `
            <iframe src="${sketch.path}"></iframe>
            <div class="label">
              <h2>${sketch.title}</h2>
              <p>${sketch.description || ''}</p>
            </div>
          `;
          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
