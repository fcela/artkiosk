// Filtered Momentum: one revenue stream of a large diversified
// financial-services firm, watched through the final year of a six-year
// record. The screen is a single view of that year. As the week advances,
// the realized cumulative line grows, and from the current week to year-end
// three methods project the remainder:
//
//   (a) the filtered trend + seasonal profile — the KZ low-pass (k passes of
//       a centered moving average of window m) pulled out of the five years
//       of history, extrapolated at the record edge by the active strategy
//       and re-anchored to the recent seasonally-adjusted level, with the
//       median detrended week-of-year pattern stitched back on;
//   (b) a run-rate built from the historical share of annual revenue
//       realized by each week; and
//   (c) a naive same-week-last-year scaling.
//
// The headline number is the featured method's projected year total; it
// revises every week. A ghost line shows last week's projection so the
// revision is visible, and the realized-to-date total sits beside it for the
// comparison. All three methods converge on the realized total as the year
// realizes — the point of the piece is watching that convergence happen and
// seeing how early calls were wrong. The full-year actual is drawn faint
// beyond the current week, so the path the projections are aiming at is
// visible, and below the cumulative panel a second panel shows the same
// weeks as weekly revenue: the realized flow against each projection's
// implied weekly shape. The projection made at the first week of each
// quarter is frozen faint behind the current call, so the drift of the
// outlook across the year is visible at a glance.
//
// The scenario cycles: each rotation picks a different segment and a
// different kind of year — steady growth, acceleration, deceleration, or a
// mid-year shock — from a random handful of segments. The generators are
// synthetic but carry the calendar quirks real series have: a ~4.3-week
// monthly cadence whose boundaries drift across years, holiday windows that
// slip by a week or two from year to year, quarter-end and month-end bumps,
// lumpy deal spikes, and occasional volatility bursts. The fixed 52-phase
// seasonal profile used for the projection can therefore only partly capture
// the monthly and drifting effects — which is exactly the gap this piece is
// meant to make visible.
//
// The three trend extrapolations (linear, reflect, replicate) and the (m,k)
// filter settings cycle on their own timers and are named in the title, so
// the piece also shows how much each choice matters. Click steps a week.

// ------------------------------------------------------------------------
// Constants & state
// ------------------------------------------------------------------------
const N = 312;                       // total weeks: 6 years x 52
const N_IN = 260;                    // history weeks (5 full years)
const F = N - N_IN;                  // the live year we are watching
const P = 52;                        // weeks per year

  { m: 25, k: 4  },
  { m: 37, k: 4  },
  { m: 49, k: 2  },

const QUARTER_START = [0, 13, 26, 39];  // first week of Q1..Q4, outlook frozen here
// The extrapolated trend is re-anchored to the recent seasonally-adjusted
// level in computeForecast, so residual annual-cycle leakage (strongest for
// the short window) and boundary blending at the record edge do not drag the
// projection; the settings only need to keep the trend smooth.
const FILTER_EDGE = 'reflect';        // stable padding for the filter itself
const STRATEGIES = [
  { id: 'linear',    label: 'linear'    },

// Calendar helper for the monthly cadence. Twelve "months" sized to fit 52
// weeks; a per-year drift shifts the boundaries by one week for part of the
// record, so a fixed week-of-year slot lands in different month positions in
// different years — the realistic mess a weekly profile cannot fully undo.
const MP = [4, 4, 5, 4, 4, 5, 4, 4, 5, 4, 4, 5];
const M_START = [];
{
  let acc = 0;
  for (const m of MP) { M_START.push(acc); acc += m; }
}
function isMonthEnd(w, y) {
  const s = w - (y >= 2 ? 1 : 0);
  if (s < 0 || s > 51) return false;
  return s === 51 || M_START.includes(s + 1);
}

  { id: 'tx-processing', label: 'transaction processing',
    base: 10.0, g: 0.0022, a52: 0.14, a26: 0.05, a13: 0.04, aM: 0.08,
    holAmp: 0.22, holStart: 45, holLen: 5, holJitter: 1,
    qeAmp: 0.08, meAmp: 0.10, sigma: 0.04, spikes: 0, spikeAmp: 0,
    shockType: 'level', shockSign: 1,

const REGIMES = ['holds', 'accelerates', 'decelerates', 'shock'];
const HAND_SIZE = 3;

const WEEK_MS = 1400;                // how long each week stays on screen
const HOLD_MS = 6000;                // linger on the finished year
const STRATEGY_MS = 30000;           // trend-extrapolation cycle
const CONDITION_MS = 60000;          // filter (m,k) cycle

const TAU = Math.PI * 2;

let signal = [], vMax = 1;
let seg = null, regime = 'holds';
let hand = [], handPos = 0;
let condIdx = 0, stratIdx = 0;
let w = 0;                           // current week of the live year, 0..51
let ghostW = null, ghostW2 = null;   // weeks whose projections we keep as ghosts
let weekT0 = 0;
let nextStratAt = 0, nextCondAt = 0;
let fc = null;                       // current forecast computation
let frozenPaths = [null, null, null, null];  // quarter-start outlook snapshots
let ymax = 1;                        // cumulative scale for the plot
const geom = {};

function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

// ------------------------------------------------------------------------
// Segment generator. Multiplicative trend with a regime-modulated sixth year,
// additive seasonality as a fraction of level, event spikes, level shifts.
// ------------------------------------------------------------------------
function makeSegmentSignal(S, reg) {
  const ph1 = Math.random() * TAU, ph2 = Math.random() * TAU,
        ph3 = Math.random() * TAU, ph4 = Math.random() * TAU;
  const jit = [];
  for (let y = 0; y < 6; y++) jit.push(S.holJitter ? Math.floor(Math.random() * 3) - 1 : 0);
  const shockW = 26 + Math.floor(Math.random() * 19);          // week 26..44 of year six
  const shockAmp = S.shockSign * (0.28 + 0.22 * Math.random());

  const gSteps = new Array(N).fill(S.g);
  if (reg === 'accelerates') {
    for (let w = 0; w < P; w++) gSteps[N_IN + w] = S.g * (1 + 1.2 * w / (P - 1));
  } else if (reg === 'decelerates') {
    for (let w = 0; w < P; w++) gSteps[N_IN + w] = S.g * (1 - 1.0 * w / (P - 1));
  }
  const cum = new Array(N);
  let c = 0;
  for (let i = 0; i < N; i++) { c += gSteps[i]; cum[i] = c; }
  const trend = (i) => S.base * Math.exp(cum[i]);

  const shift = new Array(N).fill(0);
  for (const sh of S.histShifts) {
    const a = 52 * sh.at;
    for (let i = a; i < N; i++) shift[i] += sh.amp * S.base;
  }

  const s = new Array(N);
  for (let i = 0; i < N; i++) {
    const y = Math.floor(i / P), w = i % P;
    let seas = S.a52 * Math.sin(TAU * w / P + ph1)
             + S.a26 * Math.sin(2 * TAU * w / P + ph2)
             + S.a13 * Math.sin(4 * TAU * w / P + ph3)
             + S.aM  * Math.sin(12 * TAU * w / P + ph4);       // ~4.3-week monthly
    if (S.holAmp > 0 && w >= S.holStart + jit[y] && w < S.holStart + jit[y] + S.holLen) {
      seas += S.holAmp;
    }
    if (S.qeAmp > 0 && (w === 12 || w === 25 || w === 38 || w === 51)) seas += S.qeAmp;
    if (S.meAmp > 0 && isMonthEnd(w, y)) seas += S.meAmp;
    let level = trend(i) + shift[i];
    if (i >= N_IN + shockW && S.shockType === 'level') level += shockAmp * S.base;
    let n = S.sigma * gauss();
    if (i >= N_IN + shockW && i < N_IN + shockW + 7 && S.shockType === 'burst') n *= 1 + 3 * Math.random();
    s[i] = level * (1 + seas) * (1 + n);
  }

  const outPos = new Set();
  while (outPos.size < S.spikes) outPos.add(Math.floor(Math.random() * N));
  for (const i of outPos) {
    s[i] += S.spikeAmp * S.base * (0.7 + 0.6 * Math.random()) * (Math.random() < 0.5 ? -1 : 1);
  }

  // Revenue is never negative: clamp the rare big-noise or negative-spike
  // weeks so the cumulative curves stay monotone and the share curve is sane.
  const floor = S.base * 0.03;
  for (let i = 0; i < N; i++) if (s[i] < floor) s[i] = floor;
  return s;
}

// ------------------------------------------------------------------------
// KZ filter: k passes of a centered moving average of window length m.
// The filter always pads with a fixed stable edge (FILTER_EDGE); the active
// edge strategy governs only how the filtered trend is extrapolated into the
// live year, down in computeForecast.
// ------------------------------------------------------------------------
function padValueAt(x, idx, edge) {
  const L = x.length;
  if (idx >= 0 && idx < L) return x[idx];
  if (edge === 'replicate') return idx < 0 ? x[0] : x[L - 1];
  if (edge === 'reflect') return idx < 0 ? x[-idx - 1] : x[2 * L - 1 - idx];
  if (edge === 'linear') {
    if (idx < 0) return x[0] - (-idx) * (x[1] - x[0]);
    return x[L - 1] + (idx - (L - 1)) * (x[L - 1] - x[L - 2]);
  }
  return 0;
}

function kzPassPadded(x, m, edge) {
  const L = x.length, out = new Array(L);
  const h = (m - 1) / 2;
  for (let i = 0; i < L; i++) {
    let s = 0;
    for (let j = -h; j <= h; j++) s += padValueAt(x, i + j, edge);
    out[i] = s / m;
  }
  return out;
}

function kzFilter(x, m, k, edge) {
  let out = x;
  for (let p = 0; p < k; p++) out = kzPassPadded(out, m, edge);
  return out;
}

function kernelWeights(m, k) {
  let w = new Array(m).fill(1 / m);
  for (let p = 1; p < k; p++) {
    const nw = new Array(w.length + m - 1).fill(0);
    for (let i = 0; i < w.length; i++)
      for (let j = 0; j < m; j++) nw[i + j] += w[i] / m;
    w = nw;
  }
  return w;
}

// ------------------------------------------------------------------------
// Forecast machinery. The trend is the KZ filter of the five-year history;
// the edge strategy extends it into the live year. The seasonal profile is
// the median detrended value per week-of-year; the run-rate uses the median
// cumulative share of annual revenue realized by each week across history.
// ------------------------------------------------------------------------
function computeForecast() {
  const { m, k } = CONDITIONS[condIdx];
  const strat = STRATEGIES[stratIdx];
  const sid = strat.id;
  const hw = k * (m - 1) / 2;
  const hist = signal.slice(0, N_IN);
  const T_hist = kzFilter(hist, m, k, FILTER_EDGE);
  const T6 = new Array(P);
  for (let t = 0; t < P; t++) T6[t] = padValueAt(T_hist, N_IN + t, sid);

  const S = new Array(P).fill(0);
  const buckets = Array.from({ length: P }, () => []);
  for (let i = hw; i <= N_IN - 1 - hw; i++) buckets[i % P].push(signal[i] - T_hist[i]);
  for (let w = 0; w < P; w++) {
    const a = buckets[w].sort((u, v) => u - v);
    S[w] = a.length ? a[Math.floor(a.length / 2)] : 0;
  }
  let ss = 0, nn = 0;
  for (let i = hw; i <= N_IN - 1 - hw; i++) {
    const r = signal[i] - T_hist[i] - S[i % P];
    ss += r * r; nn++;
  }
  const sigma = nn > 0 ? Math.sqrt(ss / nn) : 1;

  // Re-anchor the extrapolated trend to the recent seasonally-adjusted level:
  // the edge strategy keeps its slope, but the projection starts where the
  // business actually is, so level shifts and boundary blending don't drag it.
  let lvl = 0;
  const AL = 26;
  for (let i = N_IN - AL; i < N_IN; i++) lvl += signal[i] - S[i % P];
  const anchor = lvl / AL - T6[0];
  for (let t = 0; t < P; t++) T6[t] += anchor;

  // Run-rate detrending uses a gentle, edge-holding filter so the ratio
  // stays positive and sane; the share curve is the median across years.
  const T0 = kzFilter(hist, 13, 1, 'replicate');
  const frac = Array.from({ length: 5 }, () => new Array(P).fill(0));
  for (let y = 0; y < 5; y++) {
    let c = 0;
    for (let w = 0; w < P; w++) { c += signal[52 * y + w] / T0[52 * y + w]; frac[y][w] = c; }
    const tot = frac[y][P - 1];
    for (let w = 0; w < P; w++) if (tot > 0) frac[y][w] /= tot;
  }
  const C = new Array(P).fill(0);
  for (let w = 0; w < P; w++) {
    const col = frac.map(f => f[w]).sort((a, b) => a - b);
    C[w] = col[2];
  }

  const ytd = Array.from({ length: 6 }, () => new Array(P).fill(0));
  for (let y = 0; y < 6; y++) {
    let c = 0;
    for (let w = 0; w < P; w++) { c += signal[52 * y + w]; ytd[y][w] = c; }
  }
  const total = ytd.map(a => a[P - 1]);

  const A = new Array(P), B = new Array(P), Nc = new Array(P);
  for (let w = 0; w < P; w++) {
    let rem = 0;
    for (let t = w + 1; t < P; t++) rem += T6[t] + S[t];
    A[w] = ytd[5][w] + rem;
    B[w] = C[w] > 0 ? ytd[5][w] / C[w] : NaN;
    Nc[w] = ytd[4][w] > 0 ? total[4] * ytd[5][w] / ytd[4][w] : NaN;
  }

  // Predictive distribution of the year-end total at each week, built by
  // re-scaling the live realized-to-date through each history year's share
  // curve. The point forecast B[w] is the median of these five implied
  // totals (B[w] == ytd[5][w]/C[w] == median(Bdist[w])); their spread is the
  // historical pacing uncertainty, which collapses to a point at total[5]
  // as the year plays out (frac[y][51] == 1 for all years).
  const Bdist = Array.from({ length: P }, () => new Array(5).fill(NaN));
  const Bq = new Array(P), Bmom = new Array(P);
  for (let w = 0; w < P; w++) {
    for (let y = 0; y < 5; y++) {
      Bdist[w][y] = frac[y][w] > 0 ? ytd[5][w] / frac[y][w] : NaN;
    }
    const ord = Bdist[w].slice().sort((a, b) => a - b);
    if (ord.every(Number.isFinite)) {
      const med = ord[2];
      let mean = 0;
      for (const v of ord) mean += v; mean /= 5;
      let sv = 0;
      for (const v of ord) sv += (v - mean) * (v - mean);
      const std = Math.sqrt(sv / 4);                       // unbiased, ddof=1
      const dev = ord.map(v => Math.abs(v - med)).sort((a, b) => a - b);
      Bq[w]   = { lo: ord[0], p25: ord[1], med, p75: ord[3], hi: ord[4] };
      Bmom[w] = { mean, std, mad: dev[2] };
    } else {
      Bq[w] = { lo: NaN, p25: NaN, med: NaN, p75: NaN, hi: NaN };
      Bmom[w] = { mean: NaN, std: NaN, mad: NaN };
    }
  }

  // Historical band: leave-one-out additive projections, relative error.
  const relErr = Array.from({ length: 5 }, () => new Array(P).fill(0));
  for (let y = 0; y < 5; y++) {
    for (let w = 0; w < P; w++) {
      let rem = 0;
      for (let t = w + 1; t < P; t++) rem += T_hist[52 * y + t] + S[t];
      const py = ytd[y][w] + rem;
      relErr[y][w] = total[y] > 0 ? Math.abs(py - total[y]) / total[y] : 0;
    }
  }
  const band = new Array(P);
  for (let w = 0; w < P; w++) {
    let m2 = 0, n = 0;
    for (let y = 0; y < 5; y++) m2 += relErr[y][w], n++;
    const mean = m2 / n;
    let v = 0;
    for (let y = 0; y < 5; y++) v += (relErr[y][w] - mean) * (relErr[y][w] - mean);
    band[w] = 1.6 * Math.sqrt(v / n) * total[5];
  }

  return { seg, regime, m, k, sid, sigma, P, T_hist, T6, S, C, ytd, total,
           A, B, Nc, band, Bdist, Bq, Bmom };
}

function recompute() {
  fc = computeForecast();
  ymax = 1;
  for (const v of fc.total) if (v > ymax) ymax = v;
  ymax = Math.max(ymax, fc.A[0], fc.B[0], fc.Nc[0]);
  ymax *= 1.07;
}

function regimeText(reg, seg) {
  if (reg === 'shock') {
    if (seg.shockType === 'burst') return { label: 'volatility burst', cap: 'a burst of noise around a mid-year shock week' };
    return seg.shockSign < 0
      ? { label: 'down-shock', cap: 'a mid-year jump breaks the trend' }
      : { label: 'up-shock', cap: 'a mid-year jump lifts the total' };
  }
  return { label: REGIME_LABEL[reg], cap: REGIME_CAP[reg] };
}

function pickHand() {
  const ids = SEGMENTS.map((_, i) => i);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  hand = ids.slice(0, HAND_SIZE);
  handPos = 0;
}

function loadScenario() {
  seg = SEGMENTS[hand[handPos]];
  regime = REGIMES[Math.floor(Math.random() * REGIMES.length)];
  signal = makeSegmentSignal(seg, regime);
  vMax = 1;
  for (const v of signal) vMax = Math.max(vMax, Math.abs(v));
  vMax *= 1.08;
}

// ------------------------------------------------------------------------
// Geometry: two plots — cumulative revenue above, weekly flow below.
// ------------------------------------------------------------------------
function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function computeGeom() {
  geom.W = windowWidth;
  geom.H = windowHeight;
  geom.titleTop = 12;
  geom.left = 64;
  geom.right = 30;
  geom.xIn = 8;
  geom.headTop = 58;                       // headline band starts here
  geom.plotTop = 128;                      // cumulative panel
  geom.legendTop = geom.H - 42;            // legend strip below
  geom.flowBot = geom.legendTop - 26;      // weekly-flow panel
  const avail = geom.flowBot - geom.plotTop;
  geom.plotBot = geom.plotTop + Math.round(avail * 0.60);
  geom.flowTop = geom.plotBot + 14;
  resizeCanvas(geom.W, geom.H);
}

function sx(i) {
  const g = geom;
  return g.left + g.xIn + (g.W - g.left - g.right - 2 * g.xIn) * (i / (P - 1));
}
function sy(v) {
  const g = geom;
  return g.plotTop + 4 + (g.plotBot - g.plotTop - 8) * (1 - v / ymax);
}
function fy(v) {
  const g = geom;
  return g.flowTop + 4 + (g.flowBot - g.flowTop - 8) * (1 - v / vMax);
}
function fmt(v) {
  if (!Number.isFinite(v)) return '—';
  return v >= 100 ? v.toFixed(0) : v.toFixed(1);
}

// ------------------------------------------------------------------------
// Weekly projection paths. Each takes the projection "made at week w" and
// evaluates the cumulative revenue it implies at week t >= w, so a full
// path from w to year-end is a single pass over t. They are derived from
// the fixed forecast arrays, so every week's call can be redrawn from the
// same arrays without recomputing the forecast.
// ------------------------------------------------------------------------
function featCum(w, t) {
  if (t <= w) return fc.ytd[5][w];
  let s = fc.ytd[5][w];
  for (let u = w + 1; u <= t; u++) s += fc.T6[u] + fc.S[u];
  return s;
}
function runRateCum(w, t) {
  if (t <= w) return fc.ytd[5][w];
  const cw = fc.C[w], ct = fc.C[t];
  if (!isFinite(fc.B[w]) || ct <= cw) return fc.ytd[5][w];
  return fc.ytd[5][w] + (fc.B[w] - fc.ytd[5][w]) * (ct - cw) / (1 - cw);
}
function naiveCum(w, t) {
  if (t <= w) return fc.ytd[5][w];
  const y4w = fc.ytd[4][w], y4t = fc.ytd[4][t], den = fc.total[4] - y4w;
  if (!isFinite(fc.Nc[w]) || den <= 0) return fc.ytd[5][w];
  return fc.ytd[5][w] + (fc.Nc[w] - fc.ytd[5][w]) * (y4t - y4w) / den;
}

// Weekly-flow counterparts for the flow panel. Each sums over t > w to
// exactly the same remainder its cumulative projection implies, so the two
// panels show the same three forecasts from two angles.
function featFlow(t) {
  return fc.T6[t] + fc.S[t];
}
function runRateFlow(w, t) {
  const cw = fc.C[w], ct = fc.C[t], ct1 = fc.C[t - 1];
  if (!isFinite(fc.B[w]) || t <= w || ct <= cw) return NaN;
  return (fc.B[w] - fc.ytd[5][w]) * (ct - ct1) / (1 - cw);
}
function naiveFlow(w, t) {
  const y4w = fc.ytd[4][w], y4t = fc.ytd[4][t], y4t1 = fc.ytd[4][t - 1];
  const den = fc.total[4] - y4w;
  if (!isFinite(fc.Nc[w]) || t <= w || den <= 0) return NaN;
  return (fc.Nc[w] - fc.ytd[5][w]) * (y4t - y4t1) / den;
}

// Quarter-start outlooks: the featured projection as it stood at the first
// week of each quarter, snapshotted into an array so later method changes
// cannot rewrite history. Drawn faint behind the current call.
function quarterIndex(wk) {
  return QUARTER_START.indexOf(wk);
}
function freezeQuarter(q) {
  const fw = QUARTER_START[q];
  const path = new Array(P).fill(null);
  for (let t = fw; t < P; t++) path[t] = featCum(fw, t);
  frozenPaths[q] = { w: fw, end: fc.A[fw], path };
}
function maybeFreezeQuarter(wk) {
  const q = quarterIndex(wk);
  if (q >= 0) freezeQuarter(q);
}

// ------------------------------------------------------------------------
// Progression
// ------------------------------------------------------------------------
function advanceStrategy() {
  stratIdx = (stratIdx + 1) % STRATEGIES.length;
  recompute();
  ghostW = null; ghostW2 = null;
}
function advanceCondition() {
  condIdx = (condIdx + 1) % CONDITIONS.length;
  recompute();
  ghostW = null; ghostW2 = null;
}
function advanceScenario() {
  handPos++;
  if (handPos >= hand.length) pickHand();
  loadScenario();
  recompute();
  w = 0; ghostW = null; ghostW2 = null; weekT0 = millis();
  frozenPaths = [null, null, null, null];
  maybeFreezeQuarter(0);
  nextStratAt = millis() + STRATEGY_MS;
  nextCondAt = millis() + CONDITION_MS;
}
function stepWeek() {
  weekT0 = millis();
  if (w >= P - 1) { advanceScenario(); return; }
  ghostW = w;                             // this week becomes the previous call
  ghostW2 = w - 3 >= 0 ? w - 3 : null;
  w++;
  maybeFreezeQuarter(w);
}

function setup() {
  pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
  createCanvas(1, 1);
  computeGeom();
  textFont('Helvetica, Arial, sans-serif');
  pickHand();
  loadScenario();
  recompute();
  w = 0; ghostW = null; ghostW2 = null;
  frozenPaths = [null, null, null, null];
  maybeFreezeQuarter(0);
  weekT0 = millis();
  nextStratAt = millis() + STRATEGY_MS;
  nextCondAt = millis() + CONDITION_MS;
}

function windowResized() {
  computeGeom();
}

function mousePressed() {
  stepWeek();
}
function keyPressed() {
  if (key === 's' || key === 'S') advanceStrategy();
  else if (key === 'c' || key === 'C') advanceCondition();
  else stepWeek();
}

// ------------------------------------------------------------------------
// Frame loop. Everything is drawn directly on the main canvas each frame —
// no offscreen buffer — so text stays crisp at any devicePixelRatio.
// ------------------------------------------------------------------------
function draw() {
  if (millis() - weekT0 >= WEEK_MS) stepWeek();
  if (millis() > nextStratAt) { nextStratAt = millis() + STRATEGY_MS; advanceStrategy(); }
  if (millis() > nextCondAt) { nextCondAt = millis() + CONDITION_MS; advanceCondition(); }
  renderFrame();
}

function renderFrame() {
  const g = geom;
  const sc = rgb(STRAT_COLOR[fc.sid]);
  const cr = rgb(BASE_COL.runRate), cn = rgb(BASE_COL.naive);
  const rl = [242, 244, 248];

  background(0);

  // ------------------------------------------------------------------
  // Cumulative panel: revenue to date, the projections to year-end, and
  // the faint full-year actual they are aiming at.
  // ------------------------------------------------------------------
  noStroke();
  fill(11, 11, 14);
  rect(g.left, g.plotTop, g.W - g.left - g.right, g.plotBot - g.plotTop);

  // Gridlines + y labels.
  stroke(255, 255, 255, 22);
  strokeWeight(1);
  for (let k = 0; k <= 4; k++) {
    const v = ymax * k / 4;
    line(g.left, sy(v), g.W - g.right, sy(v));
    textAlign(RIGHT, TOP);
    textSize(11);
    noStroke();
    fill(115);
    text(fmt(v), g.left - 6, sy(v) - 5);
  }
  textAlign(RIGHT, TOP);
  fill(105);
  text('cumulative revenue, weeks of the year', g.W - g.right - 2, g.plotTop + 2);
  textAlign(LEFT, TOP);
  fill(95);
  text('quarter-start outlooks, faint', g.left + 8, g.plotTop + 2);

  // The five history years, faint — the shape a normal year takes.
  noFill();
  for (let y = 0; y < 5; y++) {
    stroke(255, 255, 255, 16);
    strokeWeight(1);
    beginShape();
    for (let t = 0; t < P; t++) vertex(sx(t), sy(fc.ytd[y][t]));
    endShape();
  }

  // The actual year, full length: solid where realized, faint beyond the
  // cursor — the path the projections converge on.
  stroke(rl[0], rl[1], rl[2], 62);
  strokeWeight(2.2);
  beginShape();
  for (let t = w + 1; t < P; t++) vertex(sx(t), sy(fc.ytd[5][t]));
  endShape();

  stroke(rl[0], rl[1], rl[2], 235);
  strokeWeight(2.2);
  beginShape();
  for (let t = 0; t <= w; t++) vertex(sx(t), sy(fc.ytd[5][t]));
  endShape();

  // Ghosts: the featured method's earlier calls, fading with age.
  if (ghostW2 != null) {
    stroke(150, 150, 160, 16);
    strokeWeight(1.4);
    beginShape();
    for (let t = ghostW2; t < P; t++) vertex(sx(t), sy(featCum(ghostW2, t)));
    endShape();
  }
  if (ghostW != null) {
    stroke(150, 150, 160, 42);
    strokeWeight(1.4);
    beginShape();
    for (let t = ghostW; t < P; t++) vertex(sx(t), sy(featCum(ghostW, t)));
    endShape();
  }

  // Quarter-start outlooks, frozen faint behind the current call, fading
  // with age — how the featured method saw the year at the Q1..Q4 starts.
  for (let q = 0; q < 4; q++) {
    const fr = frozenPaths[q];
    if (!fr) continue;
    stroke(sc[0], sc[1], sc[2], 36 + 12 * q);
    strokeWeight(1.2);
    beginShape();
    for (let t = fr.w; t < P; t++) vertex(sx(t), sy(fr.path[t]));
    endShape();
  }

  // The three projections from the current week.
  if (isFinite(fc.Nc[w])) {
    stroke(cn[0], cn[1], cn[2], 150);
    strokeWeight(1.3);
    beginShape();
    for (let t = w; t < P; t++) vertex(sx(t), sy(naiveCum(w, t)));
    endShape();
  }
  if (isFinite(fc.B[w])) {
    stroke(cr[0], cr[1], cr[2], 160);
    strokeWeight(1.3);
    beginShape();
    for (let t = w; t < P; t++) vertex(sx(t), sy(runRateCum(w, t)));
    endShape();
  }
  stroke(sc[0], sc[1], sc[2], 235);
  strokeWeight(2.4);
  beginShape();
  for (let t = w; t < P; t++) vertex(sx(t), sy(featCum(w, t)));
  endShape();

  // Cursor at the current week.
  const curX = sx(w);
  stroke(255, 255, 255, 70);
  strokeWeight(1);
  line(curX, g.plotTop + 2, curX, g.plotBot - 2);
  noStroke();
  fill(rl[0], rl[1], rl[2]);
  ellipse(curX, sy(fc.ytd[5][w]), 7, 7);

  // ------------------------------------------------------------------
  // Weekly flow panel: what each week actually brought in, and what the
  // three projections imply it should have been.
  // ------------------------------------------------------------------
  noStroke();
  fill(11, 11, 14);
  rect(g.left, g.flowTop, g.W - g.left - g.right, g.flowBot - g.flowTop);
  noFill();

  // Gridlines + y labels.
  stroke(255, 255, 255, 22);
  strokeWeight(1);
  for (let k = 0; k <= 4; k++) {
    const v = vMax * k / 4;
    line(g.left, fy(v), g.W - g.right, fy(v));
    textAlign(RIGHT, TOP);
    textSize(11);
    noStroke();
    fill(115);
    text(fmt(v), g.left - 6, fy(v) - 5);
  }
  textAlign(RIGHT, TOP);
  fill(105);
  text('weekly revenue, weeks of the year', g.W - g.right - 2, g.flowTop + 2);
  noFill();

  // Actual weekly flow: solid where realized, faint beyond.
  stroke(rl[0], rl[1], rl[2], 55);
  strokeWeight(1.8);
  beginShape();
  for (let t = w + 1; t < P; t++) vertex(sx(t), fy(signal[N_IN + t]));
  endShape();

  stroke(rl[0], rl[1], rl[2], 220);
  strokeWeight(1.8);
  beginShape();
  for (let t = 0; t <= w; t++) vertex(sx(t), fy(signal[N_IN + t]));
  endShape();

  // The three projections' implied weekly flows from the current week.
  if (isFinite(fc.Nc[w])) {
    stroke(cn[0], cn[1], cn[2], 150);
    strokeWeight(1.2);
    beginShape();
    for (let t = w + 1; t < P; t++) vertex(sx(t), fy(naiveFlow(w, t)));
    endShape();
  }
  if (isFinite(fc.B[w])) {
    stroke(cr[0], cr[1], cr[2], 150);
    strokeWeight(1.2);
    beginShape();
    for (let t = w + 1; t < P; t++) vertex(sx(t), fy(runRateFlow(w, t)));
    endShape();
  }
  stroke(sc[0], sc[1], sc[2], 210);
  strokeWeight(1.8);
  beginShape();
  for (let t = w + 1; t < P; t++) vertex(sx(t), fy(featFlow(t)));
  endShape();

  // x ticks on the bottom panel.
  stroke(255, 255, 255, 26);
  for (let wk = 13; wk <= 51; wk += 13) {
    const x = sx(wk);
    line(x, g.flowBot, x, g.flowBot + 4);
    textAlign(CENTER, TOP);
    noStroke();
    fill(115);
    text(String(wk === 51 ? 52 : wk), x, g.flowBot + 6);
  }

  // Cursor in the flow panel.
  stroke(255, 255, 255, 70);
  strokeWeight(1);
  line(curX, g.flowTop + 2, curX, g.flowBot - 2);
  noStroke();
  fill(rl[0], rl[1], rl[2]);
  ellipse(curX, fy(signal[N_IN + w]), 6, 6);

  // ------------------------------------------------------------------
  // Headline: projected year total (featured method) vs realized to date.
  // ------------------------------------------------------------------
  const tot = fc.A[w];
  const headY = g.headTop + 4;
  noStroke();
  textAlign(LEFT, TOP);
  fill(110);
  textSize(12);
  text('PROJECTED YEAR TOTAL · ' + STRATEGIES[stratIdx].label.toUpperCase(), g.left, headY);
  fill(sc[0], sc[1], sc[2]);
  textSize(46);
  text(fmt(tot), g.left, headY + 13);
  if (ghostW != null) {
    const d = tot - fc.A[ghostW];
    fill(d >= 0 ? [124, 224, 138] : [255, 107, 107]);
    textSize(14);
    text((d >= 0 ? '+' : '') + fmt(d) + ' vs last week', g.left + 190, headY + 30);
  }

  const rlX = g.W - g.right - 250;
  fill(110);
  textSize(12);
  text('REALIZED TO DATE', rlX, headY);
  fill(rl[0], rl[1], rl[2]);
  textSize(46);
  text(fmt(fc.ytd[5][w]), rlX, headY + 13);
  fill(120);
  textSize(12);
  text('week ' + w + ' of 52', rlX, headY + 60);

  // Title.
  textAlign(LEFT, TOP);
  fill(230);
  textSize(16);
  const rt = regimeText(fc.regime, fc.seg);
  text('Filtered momentum  ·  ' + fc.seg.label + '  ·  year six: ' + rt.label, g.left, g.titleTop);
  fill(130);
  textSize(12);
  const mkv = 'm=' + fc.m + '  k=' + fc.k + '  ·  trend: ';
  text(mkv, g.left, g.titleTop + 22);
  fill(sc[0], sc[1], sc[2]);
  text(STRATEGIES[stratIdx].label, g.left + textWidth(mkv), g.titleTop + 22);

  // Legend.
  const ly = g.legendTop;
  const items = [
    [rl, 'realized', ''],
    [sc, 'trend+seasonal', fmt(tot)],
    [cr, 'run-rate', fmt(fc.B[w])],
    [cn, 'naive', fmt(fc.Nc[w])],
  ];
  let lx = g.left;
  textSize(12);
  for (const [col, name, val] of items) {
    noStroke();
    fill(col[0], col[1], col[2]);
    rect(lx, ly + 2, 10, 10);
    fill(175);
    const label = name + (val ? '  ' + val : '');
    text(label, lx + 16, ly);
    lx += 16 + textWidth(label) + 28;
  }
  if (w < P - 1) {
    noStroke();
    fill(rl[0], rl[1], rl[2], 62);
    rect(lx, ly + 2, 10, 10);
    noStroke();
    fill(175);
    const label = 'future actual  ' + fmt(fc.total[5]);
    text(label, lx + 16, ly);
    lx += 16 + textWidth(label) + 28;
  }
  if (ghostW != null) {
    fill(150, 150, 160);
    rect(lx, ly + 2, 10, 10);
    fill(150);
    text('last week\u2019s call', lx + 16, ly);
  }
  textAlign(RIGHT, TOP);
  fill(90);
  textSize(11);
  text('auto-advances · click: next week · s: trend method · c: filter', g.W - g.right, ly);
  textAlign(LEFT, TOP);
}

// Read-only state probe for tests and remote debugging; the kiosk does not
// depend on it.
window.__kzProbe = {
  get w()       { return w; },
  get ghostW()  { return ghostW; },
  get seg()     { return seg ? seg.id : null; },
  get stratIdx(){ return stratIdx; },
  get condIdx() { return condIdx; },
  get total()   { return fc ? fc.total : null; },
  get frozenW() { return frozenPaths.map(f => f ? f.w : null); },
  get bq()      { return fc ? fc.Bq : null; },
  get bmom()    { return fc ? fc.Bmom : null; },
};
</script>
</body>
</html>
