<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correlation Constellation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0e; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script>
    // Eighteen exchange-traded funds, positioned only by how their weekly
    // returns move together. The distance drawn between any two is sqrt(2(1-r))
    // for their correlation r over the trailing half year: identical behaviour
    // puts them on top of one another, unrelated behaviour holds them apart.
    // Nothing else places them - there are no axes and no prices here.
    //
    // Played back from 2007, the market's own structure does the animation. In
    // quiet periods the sectors separate into recognisable neighbourhoods; in a
    // panic every correlation runs toward one and the whole constellation
    // collapses into a single knot, then breaks apart again as things calm.

    const WINDOW = 26;          // weeks in the correlation window: half a year
    const PERIODS_PER_YEAR = 52;
    // One pass through nineteen years. The kiosk gives each sketch three
    // minutes, so this is set to end a little inside that.
    const REPLAY_SECONDS = 172;
    const HOLD_SECONDS = 5;     // pause on the last week before looping

    let data = null;
    let nodes = [];
    let corr = [];              // current correlation matrix
    let vols = [];              // current annualised volatility, per asset
    let z = [];                 // standardised returns for the window
    let meanCorr = 0;
    let weekIndex = 0;
    let started = 0;
    let scaleR = 300;
    let failed = false;
    const t0Param = parseFloat(new URLSearchParams(location.search).get('t0'));
    const startOffset = isFinite(t0Param) ? t0Param : 0;

    const GROUPS = {
      tech:      { color: [122, 172, 214], label: 'Technology' },
      cyclical:  { color: [212, 170, 108], label: 'Cyclicals' },
      energy:    { color: [200, 118, 88], label: 'Energy' },
      defensive: { color: [138, 190, 158], label: 'Defensives' },
      broad:     { color: [228, 226, 216], label: 'Broad market' },
      rates:     { color: [150, 140, 204], label: 'Bonds & credit' },
      metal:     { color: [226, 198, 118], label: 'Metals' }
    };

    // What was happening while the shape on screen was forming. Each entry runs
    // from the week the market started pricing the thing to roughly the week it
    // stopped dominating, so the caption tends to lead the newspapers a little.
    //
    // Periods with nothing to say are left empty on purpose: the caption simply
    // disappears rather than reaching for something to fill the space.
    const EVENTS = [
      ['2007-06-01', '2007-10-15', 'The credit crunch begins',
       'Two Bear Stearns mortgage funds collapse in June. On 9 August BNP Paribas freezes three funds, saying it cannot value their holdings, and interbank lending seizes up.'],
      ['2007-10-16', '2008-02-28', 'The market turns',
       'The S&P 500 peaks on 9 October and rolls over. Northern Rock has already suffered the first run on a British bank in 140 years; the Fed begins cutting.'],
      ['2008-03-01', '2008-08-31', 'Bear Stearns fails',
       'JPMorgan buys Bear Stearns over a weekend in March with Fed support. Oil runs to nearly $150 in July while the financial system keeps deteriorating.'],
      ['2008-09-01', '2008-12-31', 'Lehman, and the panic',
       'Lehman Brothers files on 15 September, AIG is rescued the next day, and a money market fund breaks the buck. Everything is sold at once except Treasuries.'],
      ['2009-01-01', '2009-06-30', 'The bottom',
       'The S&P 500 troughs at 666 on 9 March, down 57% from the peak, and then rallies hard as the Fed expands asset purchases.'],
      ['2010-04-01', '2010-08-31', 'Greece, and the flash crash',
       'The euro area assembles its first Greek rescue. On 6 May the US market falls and recovers roughly nine percent within minutes.'],
      ['2011-03-01', '2011-05-31', 'Tohoku',
       'A magnitude nine earthquake and the Fukushima accident disrupt global supply chains and shut down Japanese output.'],
      ['2011-07-01', '2011-12-31', 'The euro crisis, and a downgrade',
       'S&P strips the United States of its AAA rating in August. Italian and Spanish yields climb toward levels that would price a break-up of the currency union.'],
      ['2012-06-01', '2012-10-31', '"Whatever it takes"',
       'Draghi promises in July that the ECB will do whatever it takes to preserve the euro. The Fed follows in September with open-ended purchases.'],
      ['2013-05-01', '2013-09-30', 'The taper tantrum',
       'A hint that the Fed might slow its purchases sends long yields up more than a point in four months, and hits everything that had been bought for yield.'],
      ['2014-07-01', '2015-03-31', 'Oil collapses',
       'Crude falls from about $107 in June to under $50 by January as OPEC declines to cut output, taking energy equities and high yield credit with it.'],
      ['2015-08-01', '2016-03-31', 'China, and the first hike',
       'Beijing devalues the yuan in August and equities fall worldwide. In December the Fed raises rates for the first time in nine years; oil bottoms near $26.'],
      ['2016-06-01', '2016-08-31', 'Brexit',
       'The United Kingdom votes to leave the European Union on 23 June. Sterling falls the most in its modern history and yields hit record lows.'],
      ['2016-11-01', '2017-03-31', 'The reflation trade',
       'The US election is followed by a rotation out of bonds and into banks, industrials and small caps on expectations of tax cuts and spending.'],
      ['2018-01-15', '2018-04-30', 'Volmageddon',
       'Volatility spikes on 5 February and the products that had been sold short of it collapse, wiping out several billion dollars in a single session.'],
      ['2018-10-01', '2019-02-28', 'The fourth quarter selloff',
       'The Fed keeps raising rates into a slowing economy and equities fall about twenty percent from the September high, bottoming on Christmas Eve.'],
      ['2019-07-01', '2019-11-30', 'The mid-cycle adjustment',
       'The Fed cuts three times without a recession, the yield curve inverts in August, and repo rates spike in September.'],
      ['2020-02-15', '2020-06-30', 'The pandemic',
       'Everything is sold at once - equities, credit, even Treasuries and gold - until the Fed commits to unlimited purchases on 23 March and the market turns that week.'],
      ['2020-10-15', '2021-04-30', 'Vaccines, and the meme rally',
       'Vaccine efficacy is announced in November and the rotation into cyclicals begins. In January retail traders squeeze several heavily shorted stocks.'],
      ['2021-10-01', '2022-02-15', 'Inflation stops being transitory',
       'Powell retires the word in November as inflation reaches levels not seen since the early 1980s, and the Fed prepares to tighten quickly.'],
      ['2022-02-16', '2022-07-31', 'Ukraine, and the fastest tightening in forty years',
       'Russia invades in February and commodities spike. The Fed raises by 75 basis points at a time; stocks and bonds fall together, so the usual hedge stops working.'],
      ['2022-09-01', '2022-12-31', 'The gilt crisis',
       'A UK budget triggers a collapse in long gilts and forced selling by pension funds, and the Bank of England intervenes. Equities bottom in October.'],
      ['2023-03-01', '2023-06-30', 'The regional banks',
       'Silicon Valley Bank fails on 10 March after a run, Signature follows, and Credit Suisse is absorbed by UBS the following weekend.'],
      ['2023-07-01', '2024-06-30', 'Concentration',
       'A handful of very large technology companies account for most of the index return, so the market looks calm in aggregate while everything else does not participate.'],
      ['2024-07-15', '2024-10-31', 'The carry unwind',
       'A Bank of Japan rate rise in July forces an abrupt unwinding of yen-funded positions, and volatility spikes on 5 August before recovering within weeks.']
    ];

    function preload() {
      data = loadJSON('data.json', () => {}, () => { failed = true; });
    }

    // The entry covering this week, if there is one, with a fade weight that
    // goes to zero over the first and last fortnight so captions arrive and
    // leave rather than snapping on.
    function eventAt(day) {
      for (let i = 0; i < EVENTS.length; i++) {
        const e = EVENTS[i];
        if (day >= e[0] && day <= e[1]) {
          const a = daysBetween(e[0], day);
          const b = daysBetween(day, e[1]);
          return { title: e[2], note: e[3], weight: constrain(min(a, b) / 14, 0, 1) };
        }
      }
      return null;
    }

    function daysBetween(a, b) {
      return (Date.parse(b) - Date.parse(a)) / 86400000;
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      textFont('Helvetica Neue, Helvetica, Arial, sans-serif');
      if (failed || !data || !data.assets) { failed = true; return; }

      const n = data.assets.length;
      for (let i = 0; i < n; i++) {
        const a = data.assets[i];
        // A ring is a neutral starting arrangement: no group begins nearer the
        // middle than any other.
        const th = (i / n) * TWO_PI;
        nodes.push({
          symbol: a.symbol,
          name: a.name,
          group: a.group,
          returns: a.returns,
          x: cos(th) * 220,
          y: sin(th) * 220,
          vx: 0, vy: 0,
          r: 8
        });
        corr.push(new Array(n).fill(0));
        z.push(new Array(WINDOW).fill(0));
        vols.push(0.15);
      }
      scaleR = min(width, height) * 0.35;
      background(10, 10, 14);
      computeWindow(WINDOW);
      // Settle the layout before the first frame, so the piece opens on a
      // finished constellation instead of a ring unwinding itself.
      for (let i = 0; i < 400; i++) relax();
      started = millis();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      scaleR = min(width, height) * 0.35;
      background(10, 10, 14);
    }

    // Correlation over the window ending at `end`. Standardising each asset's
    // returns first turns the correlation into a plain average of products, and
    // leaves the volatility in hand for sizing the discs.
    function computeWindow(end) {
      const n = nodes.length;
      const start = max(0, end - WINDOW + 1);
      const len = end - start + 1;
      if (len < 5) return;

      for (let i = 0; i < n; i++) {
        const rets = nodes[i].returns;
        let mean = 0;
        for (let k = 0; k < len; k++) mean += rets[start + k];
        mean /= len;
        let ss = 0;
        for (let k = 0; k < len; k++) {
          const d = rets[start + k] - mean;
          z[i][k] = d;
          ss += d * d;
        }
        const sd = Math.sqrt(ss / len) || 1;
        for (let k = 0; k < len; k++) z[i][k] /= sd;
        // Returns are stored in basis points, so a standard deviation of 100 is
        // one percent a week; annualise it the usual way.
        vols[i] = (sd / 10000) * Math.sqrt(PERIODS_PER_YEAR);
      }

      let sum = 0, pairs = 0;
      for (let i = 0; i < n; i++) {
        corr[i][i] = 1;
        for (let j = i + 1; j < n; j++) {
          let c = 0;
          for (let k = 0; k < len; k++) c += z[i][k] * z[j][k];
          c /= len;
          corr[i][j] = corr[j][i] = c;
          sum += c;
          pairs++;
        }
      }
      meanCorr = sum / max(1, pairs);
    }

    // One pass of stress relaxation: every pair pulls or pushes until the drawn
    // distance matches the distance implied by its correlation.
    function relax() {
      const n = nodes.length;
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = nodes[i], b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d = Math.sqrt(dx * dx + dy * dy);
          if (d < 0.001) { dx = random(-1, 1); dy = random(-1, 1); d = 1; }
          const target = Math.sqrt(max(0, 2 * (1 - corr[i][j]))) * scaleR;
          // Discs still need room to be read even when the market says zero.
          const floor = (a.r + b.r) * 1.15;
          const want = max(target, floor);
          const f = (d - want) * 0.0055;
          const ux = dx / d, uy = dy / d;
          a.vx += ux * f; a.vy += uy * f;
          b.vx -= ux * f; b.vy -= uy * f;
        }
      }
      let cx = 0, cy = 0;
      for (let i = 0; i < n; i++) { cx += nodes[i].x; cy += nodes[i].y; }
      cx /= n; cy /= n;
      for (let i = 0; i < n; i++) {
        const p = nodes[i];
        p.vx -= cx * 0.05; p.vy -= cy * 0.05;   // keep the whole thing centred
        p.vx *= 0.88; p.vy *= 0.88;             // damping, or it never settles
        p.x += p.vx; p.y += p.vy;
      }
    }

    function draw() {
      if (failed) { drawFailure(); return; }
      if (!nodes.length) return;

      const n = nodes.length;
      const total = data.dates.length;
      // ?t0=110 starts the replay part-way in, which is the only practical way
      // to look at one particular week without waiting for it to come round.
      const elapsed = startOffset + (millis() - started) / 1000;
      const span = REPLAY_SECONDS + HOLD_SECONDS;
      const phase = (elapsed % span) / REPLAY_SECONDS;
      weekIndex = Math.min(total - 1, Math.floor(phase * total));
      computeWindow(weekIndex);

      for (let i = 0; i < n; i++) {
        nodes[i].r = 5 + 22 * constrain((vols[i] - 0.08) / 0.45, 0, 1);
      }
      // One pass, not two: the layout then lags the correlation slightly and
      // the assets glide to their new places instead of snapping to them.
      relax();

      // Trails rather than a clean wipe: the paths the assets take as the market
      // reorganises are half the picture.
      noStroke();
      fill(10, 10, 14, 30);
      rect(0, 0, width, height);

      push();
      translate(width / 2, height / 2 - height * 0.02);

      // Edges. Only strong relationships are drawn, or the frame is a hairball.
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const c = corr[i][j];
          if (c > 0.55) {
            stroke(150, 165, 195, map(c, 0.55, 1, 0, 70));
            strokeWeight(map(c, 0.55, 1, 0.4, 1.6));
            line(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
          } else if (c < -0.25) {
            // The rare pairs moving against each other: worth seeing.
            stroke(206, 132, 96, map(c, -0.25, -0.8, 0, 60));
            strokeWeight(0.7);
            line(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
          }
        }
      }

      // Each asset is drawn twice over. The outer ring is how volatile it has
      // been over the window - how much it is capable of moving. The core is
      // what it actually did this week: filled pale and near the size of the
      // ring on a big week up, dark and sunk inside it on a big week down, and
      // barely there at all when nothing happened. A wide ring with a small
      // core is an asset that has been dangerous but was quiet this week.
      for (let i = 0; i < n; i++) {
        const p = nodes[i];
        const col = (GROUPS[p.group] || GROUPS.broad).color;
        const ret = (p.returns[weekIndex] || 0) / 10000;
        // A 5% week fills the ring, but compressed rather than linear: most
        // weeks are one or two percent, and on a linear scale every one of them
        // would draw the same near-empty dot.
        const mag = constrain(pow(abs(ret) / 0.05, 0.6), 0, 1);
        const core = p.r * (0.28 + 0.72 * mag);
        const up = ret >= 0;

        noStroke();
        fill(col[0], col[1], col[2], 22);
        circle(p.x, p.y, p.r * 3.4);
        // The volatility ring: an outline, so the core can be read against it.
        fill(col[0], col[1], col[2], 34);
        circle(p.x, p.y, p.r * 2);
        noFill();
        stroke(col[0], col[1], col[2], 165);
        strokeWeight(1.6);
        circle(p.x, p.y, p.r * 2);

        noStroke();
        if (up) {
          // Up weeks are lit: the group colour carried toward white.
          fill(lerp(col[0], 255, 0.45 * mag + 0.1),
               lerp(col[1], 252, 0.45 * mag + 0.1),
               lerp(col[2], 240, 0.45 * mag + 0.1), 240);
        } else {
          // Down weeks are sunk: the same colour taken toward the background.
          fill(lerp(col[0], 16, 0.55 * mag + 0.15),
               lerp(col[1], 16, 0.55 * mag + 0.15),
               lerp(col[2], 22, 0.55 * mag + 0.15), 240);
        }
        circle(p.x, p.y, core * 2);

        fill(col[0], col[1], col[2], 225);
        textSize(12);
        textAlign(LEFT, CENTER);
        text(p.symbol, p.x + p.r + 7, p.y);
      }
      pop();

      drawChrome(total);
    }

    // The caption, the legend and the clock. Kept quiet and to the margins: the
    // constellation should be able to hold the room on its own.
    function drawChrome(total) {
      const m = Math.round(min(width, height) * 0.055);
      noStroke();

      fill(232, 230, 222, 200);
      textAlign(LEFT, TOP);
      textSize(15);
      text('CORRELATION CONSTELLATION', m, m);
      fill(150, 150, 158, 175);
      textSize(11.5);
      text('Eighteen US exchange-traded funds, placed by the correlation of their weekly returns\n' +
           'over the previous ' + WINDOW + ' weeks. The ring is trailing volatility; the core is this\n' +
           'week\'s return, pale when it rose and dark when it fell.',
           m, m + 22);

      // The date, set large, because the whole piece is a clock.
      const d = data.dates[weekIndex] || '';
      fill(236, 234, 226, 225);
      textAlign(LEFT, BOTTOM);
      textSize(34);
      text(d.slice(0, 4), m, height - m - 20);
      // Measure the year at its own size, before switching to the smaller one.
      const yearW = textWidth(d.slice(0, 4));
      fill(150, 150, 158, 190);
      textSize(13);
      text(monthDay(d), m + yearW + 12, height - m - 24);

      // What was going on while this shape was forming. Set above the date, in
      // a column narrow enough to read at a distance. p5 anchors wrapped text
      // by the top of its box, so the block is laid out downward from a top
      // edge computed to leave the date clear.
      const ev = eventAt(d);
      if (ev) {
        const colW = min(440, width * 0.34);
        // The date is 34px set on a baseline at height-m-20, so its cap top sits
        // near height-m-56; the note block is stacked to finish clear of that.
        const noteTop = height - m - 142;
        textAlign(LEFT, BOTTOM);
        fill(228, 226, 218, 215 * ev.weight);
        textSize(15);
        text(ev.title, m, noteTop - 10);
        fill(146, 146, 156, 195 * ev.weight);
        textAlign(LEFT, TOP);
        textSize(12);
        textLeading(16);
        text(ev.note, m, noteTop, colW, 68);
      }

      // How tightly the market is moving as one thing. This number is the piece
      // in a single figure: it sits near 0.4 in calm weather and above 0.8 when
      // everyone is selling everything.
      const barW = min(260, width * 0.22);
      const bx = width - m - barW, by = height - m - 30;
      fill(150, 150, 158, 175);
      textAlign(LEFT, BOTTOM);
      textSize(11.5);
      text('AVERAGE PAIRWISE CORRELATION', bx, by - 12);
      fill(60, 60, 70, 200);
      rect(bx, by, barW, 3);
      const v = constrain(meanCorr, 0, 1);
      fill(lerpColor(color(120, 160, 200), color(226, 140, 96), v));
      rect(bx, by, barW * v, 3);
      fill(232, 230, 222, 215);
      textAlign(RIGHT, BOTTOM);
      textSize(22);
      text(nf(meanCorr, 1, 2), width - m, by - 8);

      // Where we are in the history.
      const tW = width - m * 2;
      fill(60, 60, 70, 160);
      rect(m, height - m - 3, tW, 1.5);
      fill(232, 230, 222, 200);
      rect(m + tW * (weekIndex / max(1, total - 1)) - 1, height - m - 6, 2, 7);

      // Legend, one line, right aligned under the caption.
      const keys = Object.keys(GROUPS);
      let lx = width - m;
      textAlign(RIGHT, TOP);
      textSize(11);
      for (let i = keys.length - 1; i >= 0; i--) {
        const g = GROUPS[keys[i]];
        fill(g.color[0], g.color[1], g.color[2], 190);
        text(g.label, lx, m);
        lx -= textWidth(g.label) + 22;
      }
    }

    function monthDay(iso) {
      if (!iso) return '';
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
        'August', 'September', 'October', 'November', 'December'];
      const parts = iso.split('-');
      return months[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10);
    }

    function drawFailure() {
      background(10, 10, 14);
      fill(150, 150, 158);
      textAlign(CENTER, CENTER);
      textSize(14);
      text('data.json has not been fetched yet', width / 2, height / 2);
      noLoop();
    }
  </script>
</body>
</html>
