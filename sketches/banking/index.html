<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Economic Tides</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
  <script>
    let fedFunds, unrate, cpi;
    let dataLoaded = false;
    
    let rates = [];
    let unemp = [];
    let inflation = [];
    
    function preload() {
      // Load CSVs downloaded from FRED
      fedFunds = loadTable('FEDFUNDS.csv', 'csv', 'header');
      unrate = loadTable('UNRATE.csv', 'csv', 'header');
      cpi = loadTable('CPIAUCSL.csv', 'csv', 'header');
    }
    
    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(0);
      
      // Parse data
      if (fedFunds && unrate && cpi) {
        // Filter out empty strings before converting to numbers to prevent false 0s
        let safeNumber = (val) => val.trim() !== '' ? Number(val) : NaN;
        rates = fedFunds.getColumn('FEDFUNDS').map(safeNumber).filter(n => !isNaN(n));
        unemp = unrate.getColumn('UNRATE').map(safeNumber).filter(n => !isNaN(n));
        
        // Calculate YoY inflation rate from CPI index
        let cpiRaw = cpi.getColumn('CPIAUCSL').map(safeNumber).filter(n => !isNaN(n));
        for(let i = 12; i < cpiRaw.length; i++) {
          let val = ((cpiRaw[i] - cpiRaw[i-12]) / cpiRaw[i-12]) * 100;
          if(!isNaN(val) && isFinite(val)) inflation.push(val);
        }
        
        dataLoaded = true;
      }
    }
    
    let offset = 0;
    
    function draw() {
      if (!dataLoaded) return;
      
      // Slower fade for denser trails
      background(0, 10);
      
      let radius = min(width, height) * 0.25;
      
      let steps = 1500;
      
      // Draw the connective web (divergence triangles)
      strokeWeight(0.5);
      for (let i = 0; i < steps; i += 3) { // Skip some steps for the web to look like distinct threads
        let angle = map(i, 0, steps, 0, TWO_PI);
        let shiftedAngle = (angle + offset) % TWO_PI;
        if (shiftedAngle < 0) shiftedAngle += TWO_PI;
        
        // We use rates.length as the baseline timeline length
        let exactIndex = map(shiftedAngle, 0, TWO_PI, 0, rates.length - 1);
        exactIndex = constrain(exactIndex, 0, rates.length - 1);
        
        let idx1 = floor(exactIndex);
        let idx2 = min(idx1 + 1, rates.length - 1);
        let frac = exactIndex - idx1;
        
        // Safely get interpolated values for all three (using constrained indices for the others just in case lengths differ slightly)
        let getVal = (arr) => {
          let i1 = min(idx1, arr.length - 1);
          let i2 = min(idx2, arr.length - 1);
          return lerp(arr[i1], arr[i2], frac);
        };
        
        let vRates = getVal(rates);
        let vUnemp = getVal(unemp);
        let vInf = getVal(inflation);
        
        let noiseVal = noise(cos(angle) * 1.5 + offset, sin(angle) * 1.5 + offset);
        let nOffset = map(noiseVal, 0, 1, -30, 30);
        
        let rR = radius * 0.7 + map(vRates, -2, 20, -30, 120) * 1.2 + nOffset;
        let rU = radius * 1.1 + map(vUnemp, -2, 20, -30, 120) * 1.8 + nOffset;
        let rI = radius * 1.4 + map(vInf, -2, 20, -30, 120) * 0.9 + nOffset;
        
        let xR = width/2 + rR * cos(angle); let yR = height/2 + rR * sin(angle);
        let xU = width/2 + rU * cos(angle); let yU = height/2 + rU * sin(angle);
        let xI = width/2 + rI * cos(angle); let yI = height/2 + rI * sin(angle);
        
        // The connective tissue - opacity based on divergence
        stroke(255, 255, 255, 12);
        line(xR, yR, xU, yU);
        line(xU, yU, xI, yI);
        line(xI, yI, xR, yR);
      }
      
      // Draw the main solid rings over the web
      strokeWeight(1.5);
      noFill();
      drawDataRing(rates, color(255, 80, 100, 200), radius * 0.7, 1.2);
      drawDataRing(unemp, color(80, 180, 255, 200), radius * 1.1, 1.8);
      drawDataRing(inflation, color(255, 200, 80, 200), radius * 1.4, 0.9);
      
      // Slow down the movement significantly
      offset += 0.0005;
    }
    
    // Helper to draw the solid outer lines
    function drawDataRing(dataArr, c, baseRadius, ampMultiplier) {
      stroke(c);
      beginShape();
      let steps = 1500;
      for (let i = 0; i < steps; i++) {
        let angle = map(i, 0, steps, 0, TWO_PI);
        let shiftedAngle = (angle + offset) % TWO_PI;
        if (shiftedAngle < 0) shiftedAngle += TWO_PI;
        
        let exactIndex = map(shiftedAngle, 0, TWO_PI, 0, dataArr.length - 1);
        exactIndex = constrain(exactIndex, 0, dataArr.length - 1);
        
        let idx1 = floor(exactIndex);
        let idx2 = min(idx1 + 1, dataArr.length - 1);
        let frac = exactIndex - idx1;
        let val = lerp(dataArr[idx1], dataArr[idx2], frac);
        
        let r = baseRadius + map(val, -2, 20, -30, 120) * ampMultiplier;
        let noiseVal = noise(cos(angle) * 1.5 + offset, sin(angle) * 1.5 + offset);
        r += map(noiseVal, 0, 1, -30, 30);
        
        let x = width/2 + r * cos(angle);
        let y = height/2 + r * sin(angle);
        
        if (i === 0) curveVertex(x, y);
        curveVertex(x, y);
        if (i === steps - 1) curveVertex(x, y);
      }
      endShape(CLOSE);
    }
    
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(0);
    }
  </script>
</body>
</html>
