<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Economic Tides</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
  <script>
    let fedFunds, unrate, cpi;
    let dataLoaded = false;
    
    let rates = [];
    let unemp = [];
    let inflation = [];
    
    function preload() {
      // Load CSVs downloaded from FRED
      fedFunds = loadTable('FEDFUNDS.csv', 'csv', 'header');
      unrate = loadTable('UNRATE.csv', 'csv', 'header');
      cpi = loadTable('CPIAUCSL.csv', 'csv', 'header');
    }
    
    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(0);
      
      // Parse data
      if (fedFunds && unrate && cpi) {
        // Filter out empty strings before converting to numbers to prevent false 0s
        let safeNumber = (val) => val.trim() !== '' ? Number(val) : NaN;
        rates = fedFunds.getColumn('FEDFUNDS').map(safeNumber).filter(n => !isNaN(n));
        unemp = unrate.getColumn('UNRATE').map(safeNumber).filter(n => !isNaN(n));
        
        // Calculate YoY inflation rate from CPI index
        let cpiRaw = cpi.getColumn('CPIAUCSL').map(safeNumber).filter(n => !isNaN(n));
        for(let i = 12; i < cpiRaw.length; i++) {
          let val = ((cpiRaw[i] - cpiRaw[i-12]) / cpiRaw[i-12]) * 100;
          if(!isNaN(val) && isFinite(val)) inflation.push(val);
        }
        
        dataLoaded = true;
      }
    }
    
    let timeOffset = 0;
    
    function draw() {
      if (!dataLoaded) return;
      
      // Beautiful fade effect for trails
      background(0, 15);
      
      noFill();
      strokeWeight(1.2);
      
      let radius = min(width, height) * 0.25;
      
      // Draw 3 layers corresponding to the 3 metrics, rotating perfectly in sync
      drawRing(rates, timeOffset, color(255, 80, 100, 100), radius * 0.7, 1.2);
      drawRing(unemp, timeOffset, color(80, 180, 255, 100), radius * 1.1, 1.8);
      drawRing(inflation, timeOffset, color(255, 200, 80, 100), radius * 1.4, 0.9);
      
      timeOffset += 0.003;
    }
    
    function drawRing(dataArr, offset, c, baseRadius, ampMultiplier) {
      stroke(c);
      beginShape();
      // High number of steps prevents aliasing/jitter when scanning jagged economic data
      let steps = 1500;
      for (let i = 0; i < steps; i++) {
        let angle = map(i, 0, steps, 0, TWO_PI);
        // Map the angle linearly so the dataset wraps around the circle once without mirroring.
        // We use offset to spin the data around the circle.
        let shiftedAngle = (angle + offset) % TWO_PI;
        if (shiftedAngle < 0) shiftedAngle += TWO_PI;
        
        let exactIndex = map(shiftedAngle, 0, TWO_PI, 0, dataArr.length - 1);
        exactIndex = constrain(exactIndex, 0, dataArr.length - 1);
        
        // Linearly interpolate between the two nearest data points for perfectly smooth motion
        let idx1 = floor(exactIndex);
        let idx2 = min(idx1 + 1, dataArr.length - 1);
        let frac = exactIndex - idx1;
        let val = lerp(dataArr[idx1], dataArr[idx2], frac);
        
        // Map the economic value to a radius perturbation
        let r = baseRadius + map(val, -2, 20, -30, 120) * ampMultiplier;
        
        // Add perlin noise for an organic, shifting feel
        let noiseVal = noise(cos(angle) * 1.5 + offset, sin(angle) * 1.5 + offset);
        r += map(noiseVal, 0, 1, -30, 30);
        
        let x = width/2 + r * cos(angle);
        let y = height/2 + r * sin(angle);
        
        if (i === 0) curveVertex(x, y);
        curveVertex(x, y);
        if (i === steps - 1) curveVertex(x, y);
      }
      endShape(CLOSE);
    }
    
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(0);
    }
  </script>
</body>
</html>
