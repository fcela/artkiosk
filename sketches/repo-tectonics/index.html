<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Repo Market Tectonics</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #05070d;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas { display: block; }
    #caption {
      position: fixed;
      left: 1.25rem;
      bottom: 1.1rem;
      color: #9aa4b2;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      line-height: 1.5;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #caption b { color: #d6dde8; font-weight: 600; }
    #legend {
      position: fixed;
      right: 1.25rem;
      top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      pointer-events: none;
      user-select: none;
      z-index: 5;
    }
    #legend .row { display: flex; align-items: center; gap: 0.45rem; color: #9aa4b2; }
    #legend .swatch {
      width: 1.4rem; height: 0.35rem; border-radius: 2px;
      box-shadow: 0 0 6px currentColor;
    }
    .ev-label {
      text-align: center;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7);
    }
    .ev-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: #dce4f0;
      letter-spacing: 0.04em;
    }
    .ev-note {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      font-size: 10px;
      color: #7e8fa8;
    }
    .year-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 11px;
      color: #4a5a72;
      letter-spacing: 0.06em;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .lane-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #d6dde8;
      letter-spacing: 0.14em;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 1px 3px rgba(0,0,0,0.9);
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7585;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 10;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <div id="loading">Loading tectonics&hellip;</div>
    <div id="caption">
      <b>Repo Market Tectonics</b> &middot; SOFR / BGCR / TGCR
      <br>daily 2018&ndash;now &middot; X = time, Z = rate strata, ridge HEIGHT = volume, COLOR = rate
    </div>
    <div id="legend">
      <div class="row"><span class="swatch" style="color:#143a8c"></span><span style="color:#9aa4b2">RATE low (~0%)</span></div>
      <div class="row"><span class="swatch" style="color:#2bb39f"></span><span style="color:#9aa4b2">RATE mid (~2.5%)</span></div>
      <div class="row"><span class="swatch" style="color:#f5a02e"></span><span style="color:#9aa4b2">RATE high (~5%+)</span></div>
      <div class="row" style="margin-top:0.6rem"><span style="color:#6e7a92">ridge height = volume (billions)</span></div>
    </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
