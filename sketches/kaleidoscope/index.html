<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaleidoscope</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    // Number of mirrored wedges around the center.
    const symmetry = 10;
    let t = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(HSB, 360, 100, 100, 100);
      background(0);
      strokeWeight(2);
    }

    function draw() {
      // Low-alpha overlay instead of a hard clear, so strokes leave fading trails.
      colorMode(HSB, 360, 100, 100, 100);
      noStroke();
      fill(0, 0, 0, 6);
      rect(0, 0, width, height);

      translate(width / 2, height / 2);

      const angleStep = TWO_PI / symmetry;
      const radius = min(width, height) * 0.42;

      for (let i = 0; i < symmetry; i++) {
        push();
        rotate(angleStep * i + t * 0.05);

        // A wandering point traced in polar coordinates, re-drawn in every
        // mirrored wedge so the whole canvas turns into one symmetric bloom.
        const r = radius * (0.3 + 0.7 * abs(sin(t * 0.6 + i)));
        const a = t * 1.3 + i * 0.7;
        const x = r * cos(a);
        const y = r * sin(a);

        const hue = (t * 40 + i * (360 / symmetry)) % 360;
        stroke(hue, 80, 100, 70);
        strokeWeight(4);
        line(0, 0, x, y);

        fill(hue, 90, 100, 90);
        noStroke();
        circle(x, y, 14);

        // Mirror across the wedge for a kaleidoscope reflection.
        push();
        scale(1, -1);
        circle(x, y, 14);
        pop();

        pop();
      }

      t += 0.016;
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      background(0);
    }
  </script>
</body>
</html>
