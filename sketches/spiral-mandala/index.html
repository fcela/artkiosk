<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Mandala</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    .attribution {
      position: fixed;
      bottom: 0.6rem;
      right: 0.8rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      user-select: none;
      mix-blend-mode: difference;
    }
  </style>
</head>
<body>
  <div class="attribution">Yohei Nishitsuji</div>
  <script>
    // Spiral Mandala — a raymarched logarithmic spiral. Each ray step
    // warps space into log-polar coordinates, so concentric rings
    // collapse onto themselves as the ray marches in; hue is a function
    // of ring count and a slowly sweeping time term, so the whole mandala
    // rotates and breathes through the spectrum without ever repeating.

    const vert = `
precision highp float;
attribute vec3 aPosition;
uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;

void main() {
  gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);
}
`;

    const frag = `
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;

vec3 hsv(float h, float s, float v) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(vec3(h) + K.xyz) * 6.0 - K.www);
  return v * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), s);
}

void main() {
  vec2 r = u_resolution;
  vec2 FC = gl_FragCoord.xy;
  float t = u_time;

  vec4 o = vec4(0.0, 0.0, 0.0, 1.0);

  float e = 0.001;
  float R = 0.0;
  float s = 0.0;

  vec3 q = vec3(0.0, -1.0, -1.0);
  vec3 p = vec3(0.0);
  vec3 d = vec3(FC.xy / r * 0.6 + vec2(-0.3, 0.7), 1.0);

  for(int i = 0; i < 99; i++) {
    // Prevent division by zero
    float safe_e = abs(e) < 0.0001 ? 0.0001 : e;

    o.rgb += 0.02 - hsv(R / safe_e - R, 0.6, min(e, d.y) / 16.0);

    s = 7.0;
    q += d * e * R * 0.1;

    // Clamp q to prevent rays escaping to Infinity (fixes green artifacts)
    q = clamp(q, -500.0, 500.0);

    p = q;
    R = length(p);

    float safe_R = max(R, 0.0001);

    // Clamp exponential parameter to prevent Inf/NaN hardware crash
    float exp_val = clamp(R - (p.z / safe_R) * 0.13, -15.0, 15.0);

    p = vec3(
      log2(safe_R) - t * 0.5,
      exp(exp_val),
      atan(p.y, p.x + 0.00001) - t * 0.5 // +0.00001 prevents atan(0,0)
    );

    p.y -= 1.0;
    e = p.y;

    for(int j = 0; j < 15; j++) {
      if(s >= 1000.0) break;
      e += dot(sin(p.xz * s), sin(p.xx * s + 0.5)) / s;
      s += s;
    }
  }

  gl_FragColor = vec4(clamp(o.rgb, 0.0, 1.0), 1.0);
}
`;

    let myShader;
    // Render at this fraction of screen size and let CSS stretch the canvas
    // to fullscreen. Each pixel costs ~800 trig calls, so this is the
    // difference between a buttery 60fps and a choppy 8fps on a Retina
    // display; the glow pattern upscales cleanly.
    const RENDER_SCALE = 0.5;
    // Slow the rotation: at full speed the moving rings strobe on low-FPS
    // devices, which reads as choppy even when the frame rate is fine.
    const TIME_SCALE = 0.0625;

    // p5 sets an inline width/height on the canvas that overrides stylesheet
    // rules; re-stretch the small backing store to fill the window.
    function stretchCanvas() {
      const c = document.querySelector('canvas');
      if (c) {
        c.style.width = '100vw';
        c.style.height = '100vh';
      }
    }

    function setup() {
      pixelDensity(1);
      createCanvas(windowWidth * RENDER_SCALE, windowHeight * RENDER_SCALE, WEBGL);
      myShader = createShader(vert, frag);
      noStroke();
      stretchCanvas();
    }

    function draw() {
      shader(myShader);
      myShader.setUniform('u_resolution', [width, height]);
      myShader.setUniform('u_time', millis() / 1000.0 * TIME_SCALE);

      // Draw using standard p5 coordinates
      rect(-width / 2, -height / 2, width, height);
    }

    function windowResized() {
      resizeCanvas(windowWidth * RENDER_SCALE, windowHeight * RENDER_SCALE);
      stretchCanvas();
    }
  </script>
</body>
</html>
