<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Mandala</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    .attribution {
      position: fixed;
      bottom: 0.6rem;
      right: 0.8rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      user-select: none;
      mix-blend-mode: difference;
    }
  </style>
</head>
<body>
  <div class="attribution">Yohei Nishitsuji</div>
  <script>
    // Spiral Mandala — a recursive concentric mandala. Each level of the
    // recursion draws a ring of small circles sweeping around the center;
    // the hue cycles with the frame count so the whole figure rotates
    // through the spectrum, and ADD blending accumulates the overlaps into
    // bright seams. The function calls itself with a smaller radius, so
    // every ring nests a tighter ring inside it down to a pixel-sized
    // core.

    let t;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(HSB);
      t = 0;
    }

    function draw() {
      background(0);
      noStroke();
      blendMode(ADD);
      a(width / 2, height / 2, min(width, height) / 2);
      t++;
    }

    function a(x, y, d) {
      let i, k;
      if (d > 9) {
        push();
        translate(x, y);
        for (i = 0; i < d; i += 10) {
          k = (d + t) % 256;
          rotate(TAU / d * 10);
          fill(k, 80, 100, 80);
          ellipse(i, 0, d * 0.1, d * 0.1);
        }
        pop();
        a(x, y, d * 0.6);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
